name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # run when this file changes
  workflow_dispatch: # run by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Two cards, so the README can show the one that matches the viewer's theme.
      - name: Generate streak stats (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true&timezone=Africa/Cairo&disable_animations=true
          path: profile/streak.svg

      - name: Generate streak stats (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&timezone=Africa/Cairo&disable_animations=true
          path: profile/streak-dark.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/streak-dark.svg
          git commit -m "Update streak stats" || exit 0
          git push
